plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

// ---- 多版本支持：用 -Pmc=<minecraft 版本> 选择 versions/<版本>.properties ----
def mcTarget = findProperty('mc') ?: '1.21.1'
if (mcTarget != null) {
    def versionFile = file("versions/${mcTarget}.properties")
    if (!versionFile.exists()) {
        throw new GradleException("Unknown MC target '${mcTarget}': missing ${versionFile}")
    }
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }
    props.each { key, value -> ext.set(key.toString(), value.toString()) }
    logger.lifecycle("[rollbackmod] Building for MC ${mcTarget}")
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
sourceSets.main.java.srcDir "src/versioned/${mcTarget}/java"
sourceSets.main.resources.srcDir "src/versioned/${mcTarget}/resources"

repositories {
    maven {
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${findProperty('cloth_version') ?: '15.0.140'}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    // 产物名：模组名-模组版本-游戏版本-加载器
    archiveFileName = "${mod_id}-${mod_version}-${minecraft_version}-neoforge.jar"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
